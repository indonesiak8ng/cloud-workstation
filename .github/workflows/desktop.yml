name: Desktop (Tailscale)

# A themed XFCE desktop on an Ubuntu 24.04 runner, streamed with Sunshine (H.264)
# and reachable ONLY over Tailscale. Nothing is exposed to the public internet, and
# no password ever reaches the run log.
#
#   the runner itself  ->  Ubuntu 24.04, 4 vCPU, 16 GB RAM (no nested VM)
#   Xorg + dummy driver ->  a virtual monitor, since the runner is headless
#   XFCE + Yaru         ->  light desktop, Ubuntu-styled, so the CPU is free to encode
#   Sunshine            ->  software H.264/HEVC video stream; you connect with Moonlight
#   Tailscale           ->  private WireGuard mesh; fixed name every run
#
# Why this instead of RDP: RDP ships bitmap deltas and gets heavy on scroll/drag.
# Sunshine encodes the whole screen as a low-latency video stream — the "buttery"
# feel — and XFCE keeps the desktop cheap so software encoding on a GPU-less box
# still keeps up. Connect with Moonlight (free): https://moonlight-stream.org
#
# Requires a TS_AUTHKEY secret. Optionally a LAB_PASSWORD secret (used for the
# Sunshine web UI login; otherwise one is generated and read back over Tailscale SSH).
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Tailscale machine name -> <name>.<tailnet>.ts.net"
        type: string
        default: "desktop"
      hours:
        description: "How long to hold it open (max 5.7; shorter = lower profile)."
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TS_HOSTNAME: ${{ inputs.hostname }}
      HOURS: ${{ inputs.hours }}
    steps:
      - name: Verify Tailscale secret exists
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "${TS_AUTHKEY:-}" ]; then
            echo "::error::TS_AUTHKEY secret is not set. This workflow requires Tailscale."
            echo "::error::Repo -> Settings -> Secrets and variables -> Actions -> New repository secret -> TS_AUTHKEY."
            echo "::error::Get a key at https://login.tailscale.com/admin/settings/keys (Ephemeral + Reusable, NOT tagged)."
            exit 1
          fi
          echo "TS_AUTHKEY is set."

      - name: Install XFCE (Yaru), a virtual display, and Sunshine
        run: |
          set -uo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo "::group::apt update"
          sudo apt-get update -qq
          echo "::endgroup::"

          echo "::group::XFCE + Yaru theme + virtual display"
          # Recommends left ON for the desktop so icon/theme assets come along.
          sudo apt-get install -y \
            xfce4 xfce4-terminal xfce4-whiskermenu-plugin \
            yaru-theme-gtk yaru-theme-icon fonts-ubuntu ubuntu-wallpapers \
            dbus-x11 x11-xserver-utils \
            xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-input-libinput \
            libgl1-mesa-dri \
            pulseaudio pulseaudio-utils
          echo "::endgroup::"

          echo "::group::Sunshine (latest .deb for Ubuntu 24.04)"
          URL=$(curl -fsSL https://api.github.com/repos/LizardByte/Sunshine/releases/latest \
            | jq -r '.assets[].browser_download_url' 2>/dev/null \
            | grep -E 'ubuntu-24\.04.*amd64\.deb$' | head -1 || true)
          [ -z "$URL" ] && URL="https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-ubuntu-24.04-amd64.deb"
          echo "Fetching: $URL"
          curl -fL -o /tmp/sunshine.deb "$URL"
          sudo apt-get install -y /tmp/sunshine.deb
          echo "::endgroup::"
          command -v sunshine >/dev/null && sunshine --version 2>/dev/null | head -1 || echo "::warning::sunshine binary not found after install"

      - name: Theme the desktop
        run: |
          set -uo pipefail
          XFCONF="/home/runner/.config/xfce4/xfconf/xfce-perchannel-xml"
          mkdir -p "$XFCONF" /home/runner/.config/autostart

          # GTK/icon theme + font -> the Ubuntu-styled dark look.
          cat > "$XFCONF/xsettings.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Yaru-dark"/>
              <property name="IconThemeName" type="string" value="Yaru"/>
            </property>
            <property name="Gtk" type="empty">
              <property name="FontName" type="string" value="Ubuntu 11"/>
              <property name="MonospaceFontName" type="string" value="Ubuntu Mono 12"/>
            </property>
          </channel>
          XML

          # Window borders match; compositing OFF keeps it light (Sunshine encodes the
          # final frame regardless, so we don't pay for a compositor we don't need).
          cat > "$XFCONF/xfwm4.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="theme" type="string" value="Yaru-dark"/>
              <property name="use_compositing" type="bool" value="false"/>
              <property name="box_move" type="bool" value="true"/>
              <property name="box_resize" type="bool" value="true"/>
            </property>
          </channel>
          XML

          # Panel: a modern Whisker app-menu, tasklist, tray, clock.
          cat > "$XFCONF/xfce4-panel.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-panel" version="1.0">
            <property name="panels" type="array">
              <value type="int" value="1"/>
              <property name="panel-1" type="empty">
                <property name="position" type="string" value="p=6;x=0;y=0"/>
                <property name="length" type="uint" value="100"/>
                <property name="position-locked" type="bool" value="true"/>
                <property name="size" type="uint" value="34"/>
                <property name="plugin-ids" type="array">
                  <value type="int" value="1"/>
                  <value type="int" value="2"/>
                  <value type="int" value="3"/>
                  <value type="int" value="4"/>
                  <value type="int" value="5"/>
                </property>
              </property>
            </property>
            <property name="plugins" type="empty">
              <property name="plugin-1" type="string" value="whiskermenu"/>
              <property name="plugin-2" type="string" value="tasklist"/>
              <property name="plugin-3" type="string" value="separator">
                <property name="expand" type="bool" value="true"/>
                <property name="style" type="uint" value="0"/>
              </property>
              <property name="plugin-4" type="string" value="systray"/>
              <property name="plugin-5" type="string" value="clock"/>
            </property>
          </channel>
          XML

          # Wallpaper: an Ubuntu one if present, else a Yaru-aubergine fill.
          WP=$(ls /usr/share/backgrounds/*.jpg /usr/share/backgrounds/*.png 2>/dev/null | head -1 || true)
          if [ -n "$WP" ]; then IMG_STYLE=5; else WP=""; IMG_STYLE=0; fi
          cat > "$XFCONF/xfce4-desktop.xml" <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfce4-desktop" version="1.0">
            <property name="backdrop" type="empty">
              <property name="screen0" type="empty">
                <property name="monitor0" type="empty">
                  <property name="workspace0" type="empty">
                    <property name="color-style" type="int" value="0"/>
                    <property name="image-style" type="int" value="${IMG_STYLE}"/>
                    <property name="last-image" type="string" value="${WP}"/>
                    <property name="rgba1" type="array">
                      <value type="double" value="0.17"/>
                      <value type="double" value="0.0"/>
                      <value type="double" value="0.12"/>
                      <value type="double" value="1.0"/>
                    </property>
                  </property>
                </property>
              </property>
            </property>
          </channel>
          XML

          echo "Theme seeded (Yaru-dark, wallpaper: ${WP:-solid aubergine})."

      - name: Launch the stream and hold it open
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          LAB_PASSWORD: ${{ secrets.LAB_PASSWORD }}
        run: |
          set -uo pipefail

          # --- Web UI / Moonlight password (never printed) ----------------------
          if [ -n "${LAB_PASSWORD:-}" ]; then PASS="$LAB_PASSWORD"; SRC="secret"; else PASS="$(openssl rand -hex 6)"; SRC="random"; fi
          echo "::add-mask::$PASS"
          umask 077
          printf 'sunshine web ui + moonlight pairing\nuser: runner\npass: %s\n' "$PASS" > /home/runner/.lab-credentials

          export DISPLAY=:0
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR" && sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          # --- A virtual monitor (the runner has no screen) ---------------------
          printf 'allowed_users=anybody\nneeds_root_rights=yes\n' | sudo tee /etc/X11/Xwrapper.config >/dev/null
          sudo tee /etc/X11/xorg-dummy.conf >/dev/null <<'CONF'
          Section "Device"
            Identifier "dummy"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Monitor"
            Identifier "mon"
            HorizSync 5.0 - 1000.0
            VertRefresh 5.0 - 200.0
            Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
            Modeline "1280x720"   74.25 1280 1390 1430 1650  720  725  730  750 +hsync +vsync
          EndSection
          Section "Screen"
            Identifier "screen"
            Device "dummy"
            Monitor "mon"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1920x1080" "1280x720"
              Virtual 1920 1080
            EndSubSection
          EndSection
          CONF

          /usr/bin/Xorg :0 -config /etc/X11/xorg-dummy.conf -nolisten tcp vt1 > /tmp/xorg.log 2>&1 &
          for i in $(seq 1 20); do xset -display :0 q >/dev/null 2>&1 && break; sleep 1; done
          if xset -display :0 q >/dev/null 2>&1; then echo "Virtual display :0 is up."; else
            echo "::warning title=X did not start::Stream may fail; box stays up for SSH debugging."; tail -40 /tmp/xorg.log || true
          fi

          # --- Input injection + audio sink -------------------------------------
          sudo modprobe uinput 2>/dev/null || echo "::warning::uinput unavailable; keyboard/mouse injection may not work."
          sudo chmod 0666 /dev/uinput 2>/dev/null || true
          pulseaudio --start --exit-idle-time=-1 >/tmp/pulse.log 2>&1 || true
          pactl load-module module-null-sink sink_name=stream >/dev/null 2>&1 || true
          pacmd set-default-sink stream >/dev/null 2>&1 || true

          # --- The desktop session ----------------------------------------------
          dbus-launch --exit-with-session startxfce4 > /tmp/xfce.log 2>&1 &
          sleep 6

          # --- Sunshine: web UI creds + software H.264 config -------------------
          mkdir -p /home/runner/.config/sunshine
          cat > /home/runner/.config/sunshine/sunshine.conf <<'CONF'
          encoder = software
          sw_preset = ultrafast
          sw_tune = zerolatency
          origin_web_ui_allowed = wan
          min_log_level = info
          CONF
          sunshine --creds runner "$PASS" >/tmp/creds.log 2>&1 || echo "::warning::could not seed web UI credentials; see /tmp/creds.log"
          sunshine /home/runner/.config/sunshine/sunshine.conf > /tmp/sunshine.log 2>&1 &

          for i in $(seq 1 30); do
            curl -sk https://127.0.0.1:47990/ >/dev/null 2>&1 && { echo "Sunshine is up."; break; }
            sleep 2
          done

          # --- Join the tailnet (--ssh gives you a shell on the same box too) ---
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="$TS_HOSTNAME" --ssh --accept-routes \
            > /tmp/ts.log 2>&1 || { echo "::error::tailscale up failed"; cat /tmp/ts.log || true; exit 1; }
          TS_HOST=$(sudo tailscale status --json 2>/dev/null | jq -r '.Self.DNSName // empty' | sed 's/\.$//' || true)
          TS_IP=$(sudo tailscale ip -4 2>/dev/null | head -1 || true)
          [ -z "$TS_HOST" ] && { echo "::error::Tailscale joined but reported no hostname."; sudo tailscale status || true; exit 1; }
          echo "Tailscale name: $TS_HOST"

          SECS=$(awk -v h="$HOURS" 'BEGIN{s=h*3600; if(s<300)s=300; if(s>20520)s=20520; printf "%d", s}')
          ENDS_AT=$(date -u -d "+${SECS} seconds" '+%H:%M UTC')

          {
            echo "# Desktop is live — streamed with Sunshine, private on your tailnet"
            echo ""
            echo "You connect with **Moonlight** (free): https://moonlight-stream.org — install it on this PC first."
            echo ""
            echo "## Pair, once"
            echo "1. In Moonlight: **Add PC manually** and enter"
            echo "   \`\`\`"
            echo "   ${TS_HOST}"
            echo "   \`\`\`"
            echo "   (or the IP \`${TS_IP}\`). Moonlight shows a 4-digit **PIN**."
            echo "2. Open the Sunshine web UI and enter that PIN:"
            echo "   \`\`\`"
            echo "   https://${TS_HOST}:47990"
            echo "   \`\`\`"
            echo "   Log in as **runner**. Password:"
            if [ "$SRC" = "secret" ]; then
              echo "   your \`LAB_PASSWORD\` secret."
            else
              echo "   generated, **not shown here** — read it over the tailnet (keyless):"
              echo "   \`\`\`"
              echo "   ssh runner@${TS_HOST} cat .lab-credentials"
              echo "   \`\`\`"
              echo "   (Set a \`LAB_PASSWORD\` secret to skip this next time.)"
            fi
            echo "   Accept the self-signed certificate warning, go to **PIN**, paste it, **Send**."
            echo ""
            echo "## Stream"
            echo "Back in Moonlight, click the PC → **Desktop**. For the smoothest feel, in"
            echo "Moonlight **Settings**: 1080p (or 720p if far away), 60 fps, ~15–20 Mbps, V-Sync off."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Host | \`${TS_HOST}\` (same every run) |"
            echo "| Tailnet IP | \`${TS_IP}\` |"
            echo "| Desktop | XFCE, Yaru-dark |"
            echo "| Encoder | software H.264 (no GPU on the runner) |"
            echo "| Shell too | \`ssh runner@${TS_HOST}\` — same machine |"
            echo "| Auto-stop | ~${ENDS_AT} |"
            echo ""
            echo "> **Private:** only your tailnet devices can reach it; nothing is exposed to the"
            echo "> internet, and no password appears in this log."
            echo ""
            echo "---"
            echo "_Ephemeral: nothing persists. \`touch ~/STOP\` on the box, or cancel the run, to stop early._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Moonlight host::${TS_HOST}  (web UI: https://${TS_HOST}:47990, user runner)"

          trap 'sudo tailscale logout >/dev/null 2>&1 || true' EXIT
          END=$((SECONDS + SECS))
          while [ $SECONDS -lt $END ]; do
            if [ -f /home/runner/STOP ]; then echo "STOP file found — shutting down."; break; fi
            # Keep the stream alive: if Sunshine dies, bring it back.
            if ! pgrep -x sunshine >/dev/null 2>&1; then
              echo "::warning::Sunshine exited; restarting."; sunshine /home/runner/.config/sunshine/sunshine.conf > /tmp/sunshine.log 2>&1 &
            fi
            if ! sudo tailscale status >/dev/null 2>&1; then
              echo "::warning::Tailscale dropped; reconnecting."
              sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="$TS_HOSTNAME" --ssh --accept-routes >/tmp/ts.log 2>&1 || true
            fi
            sleep 15
          done
          echo "Shutting down. The box and everything on it is now gone."
